<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reach Artifact Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#F05665; --purple:#A0189D; --ink:#0F172A; --bg:#F8F9FF; --muted:#475569; --gray:#64748B;
  --border:#E2E8F0; --white:#FFFFFF; --coral-light:#FEF2F2;
  --grad:linear-gradient(135deg,#F05665,#A0189D);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;}
a{color:var(--coral);}
.brand-logo{display:block;height:28px;width:auto;}
.logo-chip{background:var(--white);border-radius:10px;padding:8px 12px;display:inline-flex;align-items:center;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--coral);margin-bottom:6px;}
.section-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;line-height:1.2;}
.section-head{margin-bottom:22px;}
.section-head .rule{width:48px;height:4px;border-radius:2px;background:var(--grad);margin-top:12px;}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}

.auth-container{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--ink);}
.auth-hero{padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;color:var(--white);}
.auth-hero h1{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-1px;margin:18px 0 18px;max-width:520px;}
.auth-hero p{color:#CBD5E1;font-size:16px;max-width:440px;}
.auth-hero .fine{font-size:12px;color:#64748B;}
.auth-side{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg);}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(15,23,42,0.08);}
.auth-card h2{font-size:22px;font-weight:700;margin-bottom:4px;}
.auth-card .subtitle{color:var(--gray);font-size:14px;margin-bottom:24px;}
.auth-tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px;margin-bottom:22px;}
.auth-tabs button{flex:1;padding:9px;border:none;border-radius:999px;font-weight:600;font-size:14px;background:transparent;color:var(--gray);transition:all 0.2s;}
.auth-tabs button.active{background:var(--ink);color:var(--white);}
.auth-field{margin-bottom:16px;}
.auth-field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.auth-field input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:border 0.2s,box-shadow 0.2s;}
.auth-field input:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(240,86,101,0.12);}
.auth-btn{width:100%;padding:13px;border:none;border-radius:999px;font-weight:600;font-size:15px;color:var(--white);background:var(--grad);margin-top:6px;transition:opacity 0.2s,transform 0.2s;}
.auth-btn:hover{opacity:0.92;}
.auth-btn:disabled{opacity:0.5;cursor:not-allowed;}
.auth-error{background:var(--coral-light);color:#B91C1C;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;}
.auth-loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--gray);text-align:center;padding:40px;}
.auth-spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--coral);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.topbar{background:var(--ink);color:var(--white);}
.topbar-inner{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-name{font-size:16px;font-weight:700;letter-spacing:-0.2px;}
.brand-name span{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#94A3B8;}
.user-info{display:flex;align-items:center;gap:10px;}
.user-badge{font-size:13px;font-weight:500;color:#E2E8F0;}
.role-badge{background:var(--grad);padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--white);}
.logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.25);color:var(--white);padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;transition:background 0.2s;}
.logout-btn:hover{background:rgba(255,255,255,0.1);}
.nav-wrap{background:var(--ink);border-top:1px solid rgba(255,255,255,0.08);}
.nav{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:6px;overflow-x:auto;}
.nav button{padding:14px 4px;margin-right:22px;border:none;border-bottom:3px solid transparent;font-weight:600;font-size:14px;background:transparent;color:#94A3B8;white-space:nowrap;transition:color 0.2s;}
.nav button:hover{color:var(--white);}
.nav button.active{color:var(--white);border-image:var(--grad) 1;border-bottom:3px solid;}

.content{max-width:1200px;margin:0 auto;padding:32px 24px 48px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;}
.card-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 22px;border:none;border-radius:999px;font-weight:600;font-size:14px;color:var(--white);background:var(--grad);transition:opacity 0.2s;}
.btn:hover{opacity:0.92;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-sm{padding:5px 14px;font-size:12px;font-weight:600;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:999px;}
.btn-sm.red{color:#DC2626;border-color:#FECACA;}
.btn-sm.edit{color:var(--ink);}
.btn-sm:hover{background:var(--bg);}
.input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:var(--white);transition:border 0.2s,box-shadow 0.2s;}
.input:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(240,86,101,0.12);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
textarea.input{min-height:90px;resize:vertical;}
.flex-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.empty{text-align:center;color:var(--gray);padding:36px 20px;font-size:14px;}

.stat{padding:20px 22px;background:var(--white);border:1px solid var(--border);border-radius:14px;position:relative;overflow:hidden;}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad);}
.stat .label{font-size:11px;color:var(--gray);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.stat .value{font-size:34px;font-weight:800;margin-top:2px;letter-spacing:-1px;color:var(--ink);}

.dept-mark{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--white);flex-shrink:0;letter-spacing:0.5px;}
.dept-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.dept-row:last-child{border-bottom:none;}
.dept-row:hover .dept-row-name{color:var(--coral);}
.dept-row-name{font-weight:600;transition:color 0.2s;}
.dept-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px;cursor:pointer;transition:all 0.2s;}
.dept-card:hover{border-color:var(--coral);box-shadow:0 8px 24px rgba(15,23,42,0.06);transform:translateY(-2px);}
.dept-card h3{font-size:17px;font-weight:700;margin:14px 0 2px;}
.dept-card .dept-meta{font-size:12px;color:var(--gray);}
.dept-card .dept-count{font-size:30px;font-weight:800;margin-top:14px;letter-spacing:-1px;}

.artifact-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px;transition:all 0.2s;display:flex;flex-direction:column;}
.artifact-card:hover{border-color:var(--coral);box-shadow:0 8px 24px rgba(15,23,42,0.06);}
.artifact-card h4{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.35;}
.artifact-card .artifact-desc{font-size:14px;color:var(--muted);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.artifact-card .artifact-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gray);flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);}
.artifact-card .artifact-link{display:inline-flex;align-items:center;gap:6px;color:var(--coral);font-size:13px;font-weight:600;text-decoration:none;margin-bottom:12px;}
.artifact-card .artifact-link:hover{text-decoration:underline;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.badge-purple,.badge-green,.badge-blue,.badge-amber,.badge-red{background:var(--coral-light);color:#C2334A;border-color:#FBD5DA;}
.badge-gray{background:var(--bg);color:var(--muted);}

.search-bar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
.search-bar .input{flex:1;min-width:200px;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--white);border-radius:16px;padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:20px;font-weight:700;margin-bottom:20px;}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;padding:10px 12px;font-size:11px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid var(--border);}
td{padding:12px;border-bottom:1px solid var(--border);}
tr:hover td{background:var(--bg);}

.success-msg{background:#F0FDF4;color:#15803D;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:12px;}
.error-msg{background:var(--coral-light);color:#B91C1C;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:12px;}
.notice{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--coral);border-radius:14px;padding:18px 22px;margin-bottom:20px;font-size:14px;color:var(--muted);}
.notice strong{color:var(--ink);}

.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:1px solid var(--border);border-radius:999px;font-weight:600;font-size:13px;background:var(--white);color:var(--muted);margin-bottom:18px;transition:all 0.2s;}
.back-btn:hover{border-color:var(--ink);color:var(--ink);}

@media(max-width:900px){
  .auth-container{grid-template-columns:1fr;}
  .auth-hero{padding:32px 24px;}
  .auth-hero h1{font-size:32px;}
  .auth-hero .fine{display:none;}
}
@media(max-width:768px){
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .topbar-inner{padding:14px 16px;}
  .nav{padding:0 16px;}
  .content{padding:22px 16px 40px;}
  .section-title{font-size:22px;}
  .user-badge{display:none;}
}
</style>
</head>

<div id="app"></div>

const LOGO_SVG = `<svg class="brand-logo" role="img" aria-label="Reach" viewBox="0 0 116 41" fill="none" xmlns="http://www.w3.org/2000/svg">

</svg>`;
const DEPT_PALETTE = ["#F05665", "#A0189D", "#0F172A", "#D9446F", "#7A1E8C", "#334155"];
function deptColor(d){
  let h = 0; for (const ch of String(d)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return DEPT_PALETTE[h % DEPT_PALETTE.length];
}
function deptInitials(d){
  const w = String(d).trim().split(/\s+/);
  return (w.length > 1 ? w[0][0] + w[1][0] : String(d).slice(0, 2)).toUpperCase();
}
function deptMark(d){ return `<span class="dept-mark" style="background:${deptColor(d)}">${esc(deptInitials(d))}</span>`; }
function sectionHead(eyebrow, title, right){
  return `<div class="section-head flex-row" style="justify-content:space-between;align-items:flex-end">
    <div><div class="eyebrow">${eyebrow}</div><h2 class="section-title">${title}</h2><div class="rule"></div></div>
    ${right || ""}
  </div>`;
}

// Firestore collections (prefixed so they don't clash with the Grocery Tracker)
const COL_ARTIFACTS = "ap_artifacts";
const COL_USERS = "ap_users";
const COL_CONFIG = "ap_config";

// =================== STATE ===================
let db = null;
let currentUser = null;
let currentTab = "dashboard";
let currentDept = null;
let artifacts = [];
let users = [];
let departments = DEFAULT_DEPARTMENTS.slice();
let unsubs = [];
let artifactUnsubs = [];
let artifactsByDept = {};
let artifactsKey = "";
let renderTimer = null;

// =================== HELPERS ===================
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function jsArg(s){ return esc(JSON.stringify(String(s))); }
function safeUrl(u){
  u = (u || "").trim();
  return /^https?:\/\//i.test(u) ? u : "";
}
function badgeClass(dept){
  const colors = {"Finance":"purple","HR":"green","Engineering":"blue","Marketing":"amber","Operations":"red","Sales":"purple","Legal":"blue","Product":"green"};
  return "badge badge-" + (colors[dept] || "gray");
}
function myEmail(){ return currentUser ? currentUser.email.toLowerCase() : ""; }

function getCurrentUserProfile(){
  if (!currentUser) return null;
  return users.find(u => u.email === myEmail())
    || { email: myEmail(), name: myEmail().split("@")[0], role: "viewer", departments: [] };
}
function isAdmin(){
  const p = getCurrentUserProfile();
  return !!p && ADMIN_ROLES.includes(p.role);
}
function hasAllDepts(){
  const p = getCurrentUserProfile();
  return isAdmin() || (!!p && (p.departments || []).includes("*"));
}
function canAccessDept(dept){
  const p = getCurrentUserProfile();
  if (!p) return false;
  return hasAllDepts() || (p.departments || []).includes(dept);
}
function canEditDept(dept){
  const p = getCurrentUserProfile();
  if (!p) return false;
  if (isAdmin()) return true;
  return p.role === "member" && canAccessDept(dept);
}
function getDepartments(){ return departments; }
function getAccessibleDepts(){ return getDepartments().filter(d => canAccessDept(d)); }
function getDeptArtifacts(dept){
  return artifacts.filter(a => a.department === dept).sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||""));
}
function showError(msg){
  console.error(msg);
  const c = document.getElementById("mainContent");
  if (c) {
    const div = document.createElement("div");
    div.className = "error-msg";
    div.textContent = msg;
    c.prepend(div);
    setTimeout(() => div.remove(), 6000);
  }
}
function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    // Don't re-render underneath an open modal or while typing in a search box
    if (document.getElementById("modalOverlay").style.display === "flex") return;
    const ae = document.activeElement;
    if (ae && (ae.id === "deptSearch" || ae.id === "allSearch")) return;
    renderApp();
  }, 50);
}

// =================== AUTH ===================
function initFirebase(config){
  firebase.initializeApp(config);
  db = firebase.firestore();
  document.getElementById("app").innerHTML = '<div class="auth-loading"><div class="auth-spinner"></div><p>Loading...</p></div>';
  firebase.auth().onAuthStateChanged(async function(user){
    stopListeners();
    if (user) {
      if (!isAllowedEmail(user.email)) {
        window._pendingAuthError = "Only " + DOMAINS_LABEL + " accounts can use this portal.";
        await firebase.auth().signOut();
        return;
      }
      currentUser = user;
      document.getElementById("app").innerHTML = '<div class="auth-loading"><div class="auth-spinner"></div><p>Loading your library...</p></div>';
      try {
        await ensureOwnProfile();
        startListeners();
      } catch (e) {
        document.getElementById("app").innerHTML = '<div class="auth-loading"><p class="error-msg">Could not load the portal: ' + esc(e.message) + '</p><button class="btn" onclick="doLogout()">Sign Out</button></div>';
      }
    } else {
      currentUser = null;
      renderAuth();
    }
  });
}

async function ensureOwnProfile(){
  const email = myEmail();
  const ref = db.collection(COL_USERS).doc(email);
  const snap = await ref.get();
  if (!snap.exists) {
    const boot = BOOTSTRAP_USERS[email];
    await ref.set({
      email,
      name: boot ? boot.name : email.split("@")[0],
      role: boot ? boot.role : "viewer",
      departments: boot ? ["*"] : [],
      createdAt: new Date().toISOString()
    });
  }
}

function startListeners(){
  unsubs.push(db.collection(COL_USERS).onSnapshot(snap => {
    users = snap.docs.map(d => ({ email: d.id, ...d.data() }));
    syncArtifactListeners();
    scheduleRender();
  }, e => showError("Team list: " + e.message)));

  unsubs.push(db.collection(COL_CONFIG).doc("main").onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    departments = (d && Array.isArray(d.departments)) ? d.departments : DEFAULT_DEPARTMENTS.slice();
    syncArtifactListeners();
    scheduleRender();
  }, e => showError("Departments: " + e.message)));
}

// Admins / "All departments" users read the whole collection.
// Everyone else gets one listener per department they can see, so the
// security rules can verify each query.
function syncArtifactListeners(){
  if (!users.length) return;
  const key = hasAllDepts() ? "*" : getAccessibleDepts().slice().sort().join("|");
  if (key === artifactsKey) return;
  artifactsKey = key;
  artifactUnsubs.forEach(u => u());
  artifactUnsubs = [];
  artifactsByDept = {};
  artifacts = [];

  const onErr = e => showError("Artifacts: " + e.message);
  if (key === "*") {
    artifactUnsubs.push(db.collection(COL_ARTIFACTS).onSnapshot(snap => {
      artifacts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      scheduleRender();
    }, onErr));
  } else {
    getAccessibleDepts().forEach(dept => {
      artifactUnsubs.push(db.collection(COL_ARTIFACTS).where("department", "==", dept).onSnapshot(snap => {
        artifactsByDept[dept] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        artifacts = Object.values(artifactsByDept).flat();
        scheduleRender();
      }, onErr));
    });
  }
  scheduleRender();
}

function stopListeners(){
  unsubs.forEach(u => u()); unsubs = [];
  artifactUnsubs.forEach(u => u()); artifactUnsubs = [];
  artifactsKey = ""; artifactsByDept = {};
  artifacts = []; users = []; departments = DEFAULT_DEPARTMENTS.slice();
}

function renderAuth(){
  let mode = "login";
  function draw(){
    document.getElementById("app").innerHTML = `
      <div class="auth-container">
        <div class="auth-hero">
          <div><span class="logo-chip">${LOGO_SVG}</span></div>
          <div>
            <div class="eyebrow">Artifact Portal</div>
            <h1>Everything we've built, <span class="grad-text">in one place.</span></h1>
            <p>Templates, trackers, decks and tools from every Reach team — organised by department, a click away.</p>
          </div>
          <div class="fine">For Reach team members only · @reachmobile.com &amp; @reachplatform.com</div>
        </div>
        <div class="auth-side">
        <div class="auth-card">
          <h2>${mode==="login"?"Sign in":"Create your account"}</h2>
          <p class="subtitle">${mode==="login"?"Use your Reach work email.":"Use your Reach work email. An admin will grant department access."}</p>
          <div class="auth-tabs">
            <button class="${mode==="login"?"active":""}" onclick="window._authMode='login';window._drawAuth()">Sign In</button>
            <button class="${mode==="signup"?"active":""}" onclick="window._authMode='signup';window._drawAuth()">Sign Up</button>
          </div>
          <div class="auth-error" id="authError"></div>
          <div class="auth-field"><label>Email</label><input type="email" id="authEmail" placeholder="you@reachmobile.com"></div>
          <div class="auth-field"><label>Password</label><input type="password" id="authPass" placeholder="${mode==="login"?"Enter password":"Create password (min 6 chars)"}"></div>
          ${mode==="login"
            ? `<button class="auth-btn" onclick="doLogin()">Sign In</button>
               <p style="text-align:center;margin-top:14px;font-size:13px"><a href="#" onclick="doReset();return false;">Forgot password?</a></p>`
            : `<button class="auth-btn" onclick="doSignup()">Create account</button>`}
        </div>
        </div>
      </div>
    `;
  }
  window._authMode = mode;
  window._drawAuth = function(){ mode = window._authMode; draw(); };
  draw();
  if (window._pendingAuthError) { showAuthError(window._pendingAuthError); window._pendingAuthError = null; }
}

function showAuthError(msg, ok){
  const el = document.getElementById("authError");
  if (el) {
    el.style.display = "block";
    el.style.background = ok ? "#f0fdf4" : "#fef2f2";
    el.style.color = ok ? "#16a34a" : "#ef4444";
    el.textContent = msg;
  }
}

function readAuthFields(){
  return {
    email: document.getElementById("authEmail").value.trim().toLowerCase(),
    pass: document.getElementById("authPass").value
  };
}

function doLogin(){
  const { email, pass } = readAuthFields();
  if (!email || !pass) { showAuthError("Please enter email and password."); return; }
  firebase.auth().signInWithEmailAndPassword(email, pass).catch(e => showAuthError(e.message));
}

function doSignup(){
  const { email, pass } = readAuthFields();
  if (!email || !pass) { showAuthError("Please enter email and password."); return; }
  if (!isAllowedEmail(email)) { showAuthError("Please use your " + DOMAINS_LABEL + " email."); return; }
  firebase.auth().createUserWithEmailAndPassword(email, pass).catch(e => showAuthError(e.message));
}

function doReset(){
  const { email } = readAuthFields();
  if (!email) { showAuthError("Enter your email above, then click Forgot password."); return; }
  firebase.auth().sendPasswordResetEmail(email)
    .then(() => showAuthError("Password reset email sent to " + email + ".", true))
    .catch(e => showAuthError(e.message));
}

function doLogout(){ firebase.auth().signOut(); }

// =================== RENDER ===================
function renderApp(){
  if (!currentUser) return;
  const profile = getCurrentUserProfile();
  const admin = isAdmin();
  if (currentTab === "admin" && !admin) currentTab = "dashboard";
  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="logo-chip">${LOGO_SVG}</span>
          <div class="brand-name">Artifact Portal<span>Internal knowledge library</span></div>
        </div>
        <div class="user-info">
          <span class="user-badge">${esc(profile.name || profile.email)}</span>
          <span class="role-badge">${esc(profile.role)}</span>
          <button class="logout-btn" onclick="doLogout()">Sign out</button>
        </div>
      </div>
    </div>
    <div class="nav-wrap"><div class="nav" id="navBar">
      <button class="${currentTab==="dashboard"?"active":""}" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="${currentTab==="departments"?"active":""}" onclick="switchTab('departments')">Departments</button>
      <button class="${currentTab==="all"?"active":""}" onclick="switchTab('all')">All Artifacts</button>
      ${admin?`<button class="${currentTab==="admin"?"active":""}" onclick="switchTab('admin')">Admin</button>`:""}
    </div></div>
    <div class="content" id="mainContent"></div>
  `;
  renderContent();
}

function switchTab(tab){
  currentTab = tab;
  currentDept = null;
  renderApp();
}

function renderContent(){
  const c = document.getElementById("mainContent");
  if (!c) return;
  if (currentTab === "dashboard") c.innerHTML = renderDashboard();
  else if (currentTab === "departments") c.innerHTML = currentDept ? renderDeptView(currentDept) : renderDepartments();
  else if (currentTab === "all") c.innerHTML = renderAllArtifacts();
  else if (currentTab === "admin") c.innerHTML = renderAdmin();
}

// =================== DASHBOARD ===================
function fmtDate(iso){
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}
function firstName(p){ return String((p && (p.name || p.email)) || "").split(/[\s@.]/)[0]; }

function renderDashboard(){
  const depts = getAccessibleDepts();
  const visible = artifacts.filter(a => canAccessDept(a.department));
  const recent = visible.slice().sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||"")).slice(0, 6);
  const profile = getCurrentUserProfile();
  const pendingNote = (!isAdmin() && depts.length === 0)
    ? `<div class="notice"><strong>You're in.</strong> An admin just needs to add you to a department — then its artifacts show up here.</div>`
    : "";

  return `
    ${sectionHead("Dashboard", `Hi ${esc(firstName(profile))}, here's what the team has built.`)}
    ${pendingNote}
    <div class="grid grid-3" style="margin-bottom:20px">
      <div class="stat"><div class="label">Departments</div><div class="value">${depts.length}</div></div>
      <div class="stat"><div class="label">Artifacts</div><div class="value">${visible.length}</div></div>
      <div class="stat"><div class="label">Team members</div><div class="value">${users.length}</div></div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="eyebrow">Browse</div>
        <div class="card-title">Departments</div>
        ${depts.length > 0 ? depts.map(d => {
          const count = getDeptArtifacts(d).length;
          return `<div class="dept-row" onclick="openDept(${jsArg(d)})">
            <div class="flex-row" style="gap:12px">${deptMark(d)}<span class="dept-row-name">${esc(d)}</span></div>
            <span style="font-size:13px;color:var(--gray)">${count} artifact${count!==1?"s":""} &rsaquo;</span>
          </div>`;
        }).join("") : '<p class="empty">No departments yet</p>'}
      </div>

      <div class="card">
        <div class="eyebrow">Latest</div>
        <div class="card-title">Recently added</div>
        ${recent.length > 0 ? recent.map(a => `
          <div class="dept-row" style="cursor:default">
            <div style="min-width:0">
              <div style="font-weight:600;font-size:14px">${safeUrl(a.link) ? `<a href="${esc(safeUrl(a.link))}" target="_blank" rel="noopener noreferrer" style="color:var(--ink);text-decoration:none">${esc(a.title)}</a>` : esc(a.title)}</div>
              <div style="font-size:12px;color:var(--gray)">${esc(a.owner)} · ${esc(fmtDate(a.createdAt))}</div>
            </div>
            <span class="${badgeClass(a.department)}">${esc(a.department)}</span>
          </div>
        `).join("") : '<p class="empty">Nothing here yet. Be the first to add something useful.</p>'}
      </div>
    </div>
  `;
}

// =================== DEPARTMENTS ===================
function renderDepartments(){
  const depts = getAccessibleDepts();
  if (!depts.length) return sectionHead("Departments", "Your departments") + '<p class="empty">You don\'t have access to any departments yet. Ask an admin to add you.</p>';
  return `
    ${sectionHead("Departments", "Pick a team, find the tool.")}
    <div class="grid grid-3">
      ${depts.map(d => {
        const count = getDeptArtifacts(d).length;
        return `
          <div class="dept-card" onclick="openDept(${jsArg(d)})">
            ${deptMark(d)}
            <h3>${esc(d)}</h3>
            <div class="dept-meta">${canEditDept(d)?"You can add &amp; edit":"View only"}</div>
            <div class="dept-count">${count}</div>
            <div style="font-size:11px;color:var(--gray);font-weight:700;letter-spacing:1.5px;text-transform:uppercase">artifact${count!==1?"s":""}</div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function openDept(dept){
  currentDept = dept;
  currentTab = "departments";
  renderApp();
}

function renderDeptView(dept){
  if (!canAccessDept(dept)) { currentDept = null; return renderDepartments(); }
  const arts = getDeptArtifacts(dept);
  const canEdit = canEditDept(dept);

  return `
    <button class="back-btn" onclick="currentDept=null;renderApp()">&larr; All departments</button>
    ${sectionHead(`Department · ${arts.length} artifact${arts.length!==1?"s":""}`, esc(dept),
      canEdit ? `<button class="btn" onclick="openAddArtifact(${jsArg(dept)})">+ Add artifact</button>` : "")}

    <div class="search-bar">
      <input class="input" placeholder="Search ${esc(dept)} artifacts…" id="deptSearch" oninput="filterDeptArtifacts()">
    </div>

    <div id="deptArtifactsList">
      ${arts.length > 0 ? `<div class="grid grid-3">${arts.map(a => renderArtifactCard(a)).join("")}</div>` : `<p class="empty">No artifacts in ${esc(dept)} yet.${canEdit?' Add the first one.':''}</p>`}
    </div>
  `;
}

function renderArtifactCard(a){
  const isOwner = a.ownerEmail === myEmail();
  const showActions = isAdmin() || (isOwner && canEditDept(a.department));
  const link = safeUrl(a.link);

  return `
    <div class="artifact-card">
      <div class="flex-row" style="justify-content:space-between;margin-bottom:10px">
        <span class="${badgeClass(a.department)}">${esc(a.department)}</span>
        <span style="font-size:12px;color:var(--gray)">${esc(fmtDate(a.createdAt))}</span>
      </div>
      <h4>${esc(a.title)}</h4>
      <p class="artifact-desc">${esc(a.description) || "No description yet."}</p>
      ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="artifact-link">Open artifact &rarr;</a>` : ""}
      <div class="artifact-meta">
        <span>By ${esc(a.owner)}</span>
        ${showActions ? `
          <div class="flex-row">
            <button class="btn-sm edit" onclick="openEditArtifact(${jsArg(a.id)})">Edit</button>
            <button class="btn-sm red" onclick="deleteArtifact(${jsArg(a.id)})">Delete</button>
          </div>
        ` : ""}
      </div>
    </div>
  `;
}
function matchesQuery(a, q){
  return (a.title||"").toLowerCase().includes(q) || (a.description||"").toLowerCase().includes(q) || (a.owner||"").toLowerCase().includes(q);
}

function filterDeptArtifacts(){
  const q = (document.getElementById("deptSearch")?.value || "").toLowerCase();
  let arts = getDeptArtifacts(currentDept);
  if (q) arts = arts.filter(a => matchesQuery(a, q));
  const el = document.getElementById("deptArtifactsList");
  if (el) el.innerHTML = arts.length > 0 ? `<div class="grid grid-3">${arts.map(a => renderArtifactCard(a)).join("")}</div>` : '<p class="empty">No matching artifacts</p>';
}

// =================== ALL ARTIFACTS ===================
function renderAllArtifacts(){
  const arts = artifacts.filter(a => canAccessDept(a.department)).sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||""));
  return `
    ${sectionHead("Library", "All artifacts")}
    <div class="search-bar">
      <input class="input" placeholder="Search by title, owner or description…" id="allSearch" oninput="filterAllArtifacts()">
      <select class="input" style="width:220px" id="allDeptFilter" onchange="filterAllArtifacts()">
        <option value="">All departments</option>
        ${getAccessibleDepts().map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}
      </select>
    </div>
    <div id="allArtifactsList">
      ${renderArtifactList(arts)}
    </div>
  `;
}
function renderArtifactList(arts){
  if (arts.length === 0) return '<p class="empty">No artifacts found</p>';
  return `<div class="grid grid-3">${arts.map(a => renderArtifactCard(a)).join("")}</div>`;
}

function filterAllArtifacts(){
  const q = (document.getElementById("allSearch")?.value || "").toLowerCase();
  const dept = document.getElementById("allDeptFilter")?.value || "";
  let arts = artifacts.filter(a => canAccessDept(a.department)).sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||""));
  if (dept) arts = arts.filter(a => a.department === dept);
  if (q) arts = arts.filter(a => matchesQuery(a, q));
  const el = document.getElementById("allArtifactsList");
  if (el) el.innerHTML = renderArtifactList(arts);
}

// =================== ARTIFACT CRUD ===================
function modalError(msg){
  let el = document.getElementById("modalError");
  if (!el) {
    el = document.createElement("div");
    el.id = "modalError";
    el.className = "error-msg";
    const body = document.getElementById("modalBody");
    const h = body.querySelector('h3'); body.insertBefore(el, h ? h.nextSibling : body.firstChild);
  }
  el.textContent = msg;
}

function openModal(html){
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalOverlay").style.display = "flex";
}

function closeModal(){
  document.getElementById("modalOverlay").style.display = "none";
  scheduleRender();
}

function openAddArtifact(dept){
  const profile = getCurrentUserProfile();
  openModal(`
    <div class="eyebrow">New artifact</div><h3>Add to ${esc(dept)}</h3>
    <div class="field"><label>Title *</label><input class="input" id="artTitle" placeholder="e.g. Q4 Budget Report"></div>
    <div class="field"><label>Description</label><textarea class="input" id="artDesc" placeholder="Brief description of this artifact..."></textarea></div>
    <div class="field"><label>Link (URL)</label><input class="input" id="artLink" placeholder="https://claude.ai/... or https://docs.google.com/..."></div>
    <div class="field"><label>Owner</label><input class="input" id="artOwner" value="${esc(profile.name || currentUser.email)}"></div>
    <button class="btn" id="artSaveBtn" style="width:100%;justify-content:center;margin-top:8px" onclick="addArtifact(${jsArg(dept)})">Add artifact</button>
  `);
}

async function addArtifact(dept){
  const title = document.getElementById("artTitle").value.trim();
  const description = document.getElementById("artDesc").value.trim();
  const rawLink = document.getElementById("artLink").value.trim();
  const owner = document.getElementById("artOwner").value.trim();
  if (!title) { modalError("Please enter a title."); return; }
  if (rawLink && !safeUrl(rawLink)) { modalError("Link must start with http:// or https://"); return; }
  const btn = document.getElementById("artSaveBtn"); btn.disabled = true;
  const now = new Date().toISOString();
  try {
    await db.collection(COL_ARTIFACTS).add({
      title, description, link: rawLink,
      owner: owner || myEmail(),
      ownerEmail: myEmail(),
      department: dept,
      createdAt: now, updatedAt: now
    });
    closeModal();
  } catch (e) { btn.disabled = false; modalError("Could not save: " + e.message); }
}

function openEditArtifact(id){
  const a = artifacts.find(x => x.id === id);
  if (!a) return;
  const deptOptions = isAdmin() ? getDepartments() : getDepartments().filter(d => canEditDept(d));
  openModal(`
    <div class="eyebrow">Artifact</div><h3>Edit details</h3>
    <div class="field"><label>Title *</label><input class="input" id="editTitle" value="${esc(a.title)}"></div>
    <div class="field"><label>Description</label><textarea class="input" id="editDesc">${esc(a.description)}</textarea></div>
    <div class="field"><label>Link (URL)</label><input class="input" id="editLink" value="${esc(a.link)}"></div>
    <div class="field"><label>Owner</label><input class="input" id="editOwner" value="${esc(a.owner)}"></div>
    <div class="field"><label>Department</label>
      <select class="input" id="editDept">${deptOptions.map(d=>`<option value="${esc(d)}" ${d===a.department?"selected":""}>${esc(d)}</option>`).join("")}</select>
    </div>
    <button class="btn" id="editSaveBtn" style="width:100%;justify-content:center;margin-top:8px" onclick="saveEditArtifact(${jsArg(id)})">Save changes</button>
  `);
}

async function saveEditArtifact(id){
  const title = document.getElementById("editTitle").value.trim();
  const link = document.getElementById("editLink").value.trim();
  if (!title) { modalError("Please enter a title."); return; }
  if (link && !safeUrl(link)) { modalError("Link must start with http:// or https://"); return; }
  const btn = document.getElementById("editSaveBtn"); btn.disabled = true;
  try {
    await db.collection(COL_ARTIFACTS).doc(id).update({
      title,
      description: document.getElementById("editDesc").value.trim(),
      link,
      owner: document.getElementById("editOwner").value.trim(),
      department: document.getElementById("editDept").value,
      updatedAt: new Date().toISOString()
    });
    closeModal();
  } catch (e) { btn.disabled = false; modalError("Could not save: " + e.message); }
}

async function deleteArtifact(id){
  const a = artifacts.find(x => x.id === id);
  if (!confirm(`Delete "${a ? a.title : "this artifact"}"? This can't be undone.`)) return;
  try { await db.collection(COL_ARTIFACTS).doc(id).delete(); }
  catch (e) { showError("Could not delete: " + e.message); }
}

// =================== ADMIN ===================
function renderAdmin(){
  if (!isAdmin()) return '<p class="empty">Access denied</p>';
  const depts = getDepartments();
  const sorted = users.slice().sort((a,b) => (a.name||a.email).localeCompare(b.name||b.email));
  return `
    ${sectionHead("Admin", "People &amp; access")}
    <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
      <div class="card" style="overflow-x:auto">
        <div class="eyebrow">Team</div>
        <div class="card-title" style="margin-bottom:4px">Members</div>
        <p style="font-size:13px;color:var(--gray);margin-bottom:14px">People appear here after they sign up. Viewers can read; Members can also add to their departments.</p>
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Departments</th><th></th></tr></thead>
          <tbody>
            ${sorted.map(u => `
              <tr>
                <td style="font-weight:600">${esc(u.name)}</td>
                <td style="font-size:13px;color:var(--gray)">${esc(u.email)}</td>
                <td><span class="badge ${ADMIN_ROLES.includes(u.role)?'badge-purple':''}">${esc(u.role)}</span></td>
                <td style="font-size:13px">${(u.departments||[]).includes("*")?"All":esc((u.departments||[]).join(", "))||"None"}</td>
                <td style="text-align:right"><button class="btn-sm edit" onclick="openEditUser(${jsArg(u.email)})">Edit</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>

      <div class="card">
        <div class="eyebrow">Structure</div>
        <div class="card-title">Departments</div>
        ${depts.map(d => `
          <div class="dept-row" style="cursor:default">
            <div class="flex-row" style="gap:12px">
              ${deptMark(d)}
              <div><div style="font-weight:600">${esc(d)}</div><div style="font-size:12px;color:var(--gray)">${getDeptArtifacts(d).length} artifact${getDeptArtifacts(d).length!==1?"s":""}</div></div>
            </div>
            <button class="btn-sm red" onclick="removeDept(${jsArg(d)})">Remove</button>
          </div>
        `).join("")}
        <div style="display:flex;gap:8px;margin-top:16px">
          <input class="input" id="newDeptName" placeholder="New department" style="flex:1">
          <button class="btn" onclick="addDept()">Add</button>
        </div>
      </div>
    </div>
  `;
}
function toggleAllDepts(cb){
  document.querySelectorAll('.deptCb').forEach(c => { c.checked = cb.checked; c.disabled = cb.checked; });
}

function openEditUser(email){
  const u = users.find(x => x.email === email);
  if (!u) return;
  const depts = getDepartments();
  const hasAll = (u.departments||[]).includes("*");
  const roles = [["viewer","Viewer (read only)"],["member","Member (can add artifacts)"],["admin","Admin (full access)"],["founder","Founder (full access)"],["ceo","CEO (full access)"]];
  openModal(`
    <div class="eyebrow">Member</div><h3>${esc(u.name)}</h3>
    <div class="field"><label>Name</label><input class="input" id="editUserName" value="${esc(u.name)}"></div>
    <div class="field"><label>Email</label><input class="input" value="${esc(u.email)}" disabled style="background:#f1f5f9"></div>
    <div class="field"><label>Role</label>
      <select class="input" id="editUserRole">
        ${roles.map(([v,l]) => `<option value="${v}" ${u.role===v?"selected":""}>${l}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>Department Access</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
        <label style="font-size:13px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="allDeptsCb" ${hasAll?"checked":""} onchange="toggleAllDepts(this)"> All</label>
        ${depts.map(d => `<label style="font-size:13px;display:flex;align-items:center;gap:4px"><input type="checkbox" value="${esc(d)}" class="deptCb" ${hasAll||(u.departments||[]).includes(d)?"checked":""} ${hasAll?"disabled":""}> ${esc(d)}</label>`).join("")}
      </div>
    </div>
    <button class="btn" id="userSaveBtn" style="width:100%;justify-content:center;margin-top:8px" onclick="saveEditUser(${jsArg(email)})">Save changes</button>
  `);
}

async function saveEditUser(email){
  const role = document.getElementById("editUserRole").value;
  if (email === myEmail() && !ADMIN_ROLES.includes(role)) {
    modalError("You can't remove your own admin access. Ask another admin to do it.");
    return;
  }
  let depts = [];
  if (document.getElementById("allDeptsCb").checked) depts = ["*"];
  else document.querySelectorAll('.deptCb:checked').forEach(c => depts.push(c.value));
  const btn = document.getElementById("userSaveBtn"); btn.disabled = true;
  try {
    await db.collection(COL_USERS).doc(email).update({
      name: document.getElementById("editUserName").value.trim() || email.split("@")[0],
      role,
      departments: depts
    });
    closeModal();
  } catch (e) { btn.disabled = false; modalError("Could not save: " + e.message); }
}

async function saveDepartmentsList(list){
  try { await db.collection(COL_CONFIG).doc("main").set({ departments: list }, { merge: true }); }
  catch (e) { showError("Could not update departments: " + e.message); }
}

function addDept(){
  const name = (document.getElementById("newDeptName")?.value || "").trim();
  if (!name) return;
  if (getDepartments().includes(name)) { showError("Department already exists."); return; }
  saveDepartmentsList(getDepartments().concat([name]));
}

function removeDept(name){
  const n = getDeptArtifacts(name).length;
  if (!confirm(`Remove department "${name}"?${n ? ` Its ${n} artifact(s) stay in the database but won't be shown.` : ""}`)) return;
  saveDepartmentsList(getDepartments().filter(d => d !== name));
}

// =================== STARTUP ===================
initFirebase(FIREBASE_CONFIG);
</script>
</body>
</html>
